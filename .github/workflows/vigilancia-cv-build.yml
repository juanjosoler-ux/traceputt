name: Build Vigilancia CV APK
on:
  push:
    branches:
      - vigilancia-cv-apk-20261018
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        run: gradle -p vigilanciacv :app:assembleDebug --no-daemon --stacktrace
      - name: Verify package
        run: |
          test -s vigilanciacv/app/build/outputs/apk/debug/app-debug.apk
          unzip -t vigilanciacv/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging vigilanciacv/app/build/outputs/apk/debug/app-debug.apk | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: VigilanciaCV-Android
          path: vigilanciacv/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 15
